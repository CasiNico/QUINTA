<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Pagina Pantone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #e9dfd8; /* Nude 7506C (approx) */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #124414; /* Pantone 743 CP (approx) */
    }

    button {
      background-color: #bddfa5; /* Green Ash 13-0117 TPG (approx) */
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Benvenuto!</h1>
    <button onclick="alert('Hai cliccato il bottone!')">
      Cliccami
    </button>
  </div>

</body>
</html>
